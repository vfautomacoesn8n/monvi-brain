version: '3.8'

services:
  postgres-dev:
    image: postgres:16-alpine
    container_name: monvi-brain-postgres-dev
    environment:
      POSTGRES_DB: monvi_brain_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d monvi_brain_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
